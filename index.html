<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student task tracker built with HTML, CSS, and JavaScript.">
  <title>My Task Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #17233b; background: linear-gradient(135deg, #e8f1ff, #f5edff); min-height: 100vh; display: grid; place-items: center; padding: 22px; }
    .app { width: 100%; max-width: 540px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 12px 40px #344a7426; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { margin: 0 0 24px; color: #68758d; line-height: 1.5; }
    form { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; padding: 13px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
    button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
    .add { background: #4f46e5; color: white; padding: 0 20px; font-weight: bold; }
    .add:hover { background: #4338ca; }
    .status { color: #64748b; font-size: 14px; margin: 22px 0 12px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #edf0f5; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { text-decoration: line-through; color: #94a3b8; }
    .check { width: 20px; height: 20px; accent-color: #4f46e5; cursor: pointer; }
    .delete { background: #fee2e2; color: #b91c1c; padding: 7px 10px; }
    .delete:hover { background: #fecaca; }
    .empty { text-align: center; color: #94a3b8; margin-top: 25px; }
    footer { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 28px; }
    @media (max-width: 420px) { .app { padding: 22px; } form { flex-direction: column; } .add { padding: 12px; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>✅ My Task Tracker</h1>
    <p class="subtitle">Add your daily tasks, mark them complete, and stay organized.</p>
    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="Enter a new task..." aria-label="New task" maxlength="120" required>
      <button class="add" type="submit">Add Task</button>
    </form>
    <p id="status" class="status" aria-live="polite">0 tasks remaining</p>
    <ul id="taskList"></ul>
    <p id="empty" class="empty">No tasks yet. Add your first task!</p>
    <footer>Built with HTML, CSS &amp; JavaScript · Ready for GitHub Pages</footer>
  </main>
  <script>
    const input = document.getElementById('taskInput');
    const list = document.getElementById('taskList');
    const status = document.getElementById('status');
    const empty = document.getElementById('empty');
    const form = document.getElementById('taskForm');
    let tasks;
    try { tasks = JSON.parse(localStorage.getItem('my-tasks') || '[]'); }
    catch { tasks = []; }
    if (!Array.isArray(tasks)) tasks = [];

    function saveAndShow() {
      localStorage.setItem('my-tasks', JSON.stringify(tasks));
      list.innerHTML = '';
      tasks.forEach((task) => {
        const item = document.createElement('li');
        if (task.done) item.classList.add('done');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'check';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', 'Mark ' + task.text + ' complete');
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          saveAndShow();
        });
        const label = document.createElement('span');
        label.textContent = task.text;
        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete ' + task.text);
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveAndShow();
        });
        item.append(checkbox, label, del);
        list.appendChild(item);
      });
      const remaining = tasks.filter(task => !task.done).length;
      status.textContent = remaining + (remaining === 1 ? ' task' : ' tasks') + ' remaining';
      empty.hidden = tasks.length > 0;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now() + Math.random(), text, done: false });
      input.value = '';
      saveAndShow();
      input.focus();
    });
    saveAndShow();
  </script>
</body>
</html>
